# O Supabase Free pausa projetos sem atividade por 7 dias. Com a operação 24/7
# isso é improvável, mas em período parado (ex.: implantação) este ping a cada
# 3 dias evita a pausa. Faz uma leitura pública de categorias (sem dados pessoais).
#
# Secrets: SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY (os mesmos valores públicos do app)
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta leve na API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/categorias?select=id&limit=1"
